name: Bug report
description: Flashpoint did something wrong, crashed, or wouldn't import a log.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Questions ("how do I…?") go in [Q&A discussions](https://github.com/IgniteRobotics/flashpoint/discussions/categories/q-a) instead.

        **Don't attach match logs** (`.wpilog`, `.hoot`) to this issue: it's public, and logs hold your team's match data. Name the files and say what's in them below. If we need a log to reproduce the problem, a maintainer will ask you to share it privately (for example a Google Drive or Dropbox link shared only with them).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: Paste any error message as text. For a wrong number, say which view, match and device, and what you expected it to be.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran or the clicks in the app, in order.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Flashpoint version
      description: The output of `flashpoint --version`.
      placeholder: flashpoint 0.3.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: The output of `python3 --version` (on Windows, `py --version`). If you installed with uv or pipx, the Python it used.
      placeholder: Python 3.12.7
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`flashpoint doctor` output"
      description: Run `flashpoint doctor` and paste everything it prints.
      render: text
    validations:
      required: true
  - type: dropdown
    id: logs
    attributes:
      label: Kinds of logs involved
      description: Pick every kind the problem involves.
      multiple: true
      options:
        - WPILib .wpilog
        - roboRIO .hoot
        - CANivore .hoot
        - AdvantageKit .wpilog
        - No logs involved
    validations:
      required: true
  - type: dropdown
    id: pro
    attributes:
      label: Are the hoots from Phoenix Pro devices?
      description: Without Phoenix Pro, some signals (such as continuous device temperature) aren't in the hoot.
      options:
        - "Yes"
        - "No"
        - Don't know
    validations:
      required: true
  - type: textarea
    id: ingest-line
    attributes:
      label: For an import problem, the ingest line for the file
      description: >-
        The line `flashpoint ingest` printed for the file, with its stage and reason,
        for example `QUARANTINED <file>: invalid-header`, `FAILED <file>: failed (owlet-failed), will retry`,
        `SKIPPED <file>: quarantined earlier (<reason>)` or `WARNING <file>: incomplete-read`.
      render: text
    validations:
      required: false
