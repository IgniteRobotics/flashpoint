name: ci

on:
  pull_request:
  push:
    branches: [main, rewrite]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint-test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: poetry
      - run: poetry install --no-interaction
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run mypy src tests tools
      - run: poetry run pytest -m "not corpus"

  corpus:
    name: corpus
    runs-on: ubuntu-latest
    env:
      FLASHPOINT_CORPUS_DIR: ${{ github.workspace }}/.corpus
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      - run: poetry install --no-interaction
      - uses: actions/cache@v4
        with:
          path: .corpus
          key: corpus-${{ hashFiles('tests/corpus/manifest.toml') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/flashpoint/owlet
          key: owlet-${{ runner.os }}-${{ hashFiles('src/flashpoint/readers/owlet-manifest.toml') }}
      - run: poetry run python tools/fetch-corpus.py
      - run: poetry run pytest -m "corpus and not perf"

  perf:
    name: perf (budgets, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      FLASHPOINT_CORPUS_DIR: ${{ github.workspace }}/.corpus
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      - run: poetry install --no-interaction
      - uses: actions/cache@v4
        with:
          path: .corpus
          key: corpus-${{ hashFiles('tests/corpus/manifest.toml') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/flashpoint/owlet
          key: owlet-${{ runner.os }}-${{ hashFiles('src/flashpoint/readers/owlet-manifest.toml') }}
      - run: poetry run python tools/fetch-corpus.py
      - run: poetry run pytest -m perf -s
