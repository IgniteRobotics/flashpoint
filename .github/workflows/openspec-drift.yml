name: OpenSpec drift check

on:
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  openspec-tool-files:
    name: OpenSpec tool files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Regenerate from the recipe and fail on drift
        run: node .ignite/openspec-regen.mjs --check
