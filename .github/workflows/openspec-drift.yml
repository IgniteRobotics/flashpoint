name: OpenSpec drift check

on:
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  openspec-tool-files:
    name: OpenSpec tool files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Regenerate from the recipe and fail on drift
        run: node .ignite/openspec-regen.mjs --check
