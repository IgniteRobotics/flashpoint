name: release

# A `v*` tag builds the sdist and wheel with the version taken from the tag and publishes them
# to PyPI by trusted publishing (OIDC, no stored token), then creates the GitHub Release with
# that version's CHANGELOG.md section as its notes (spec public-release). A manual run publishes
# a dry run to TestPyPI instead, under the version given, and creates no GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the TestPyPI dry run (e.g. 0.2.0.dev1)"
        required: true

# Read-only by default; the publish jobs widen it to id-token for trusted publishing, and only
# github-release gets contents: write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before anything is built or published: a tag with no CHANGELOG.md section stops here.
      - name: Take the release notes from CHANGELOG.md
        id: notes
        if: github.event_name == 'push'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release-notes
          python3 tools/changelog-section.py "$VERSION" > release-notes/notes.md
          echo "prerelease=$(python3 tools/changelog-section.py "$VERSION" --is-pre-release)" >> "$GITHUB_OUTPUT"
      - run: pipx install poetry
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set the version
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: poetry version "${VERSION#v}"
      - run: poetry build
      # mvp-documentation's README pin step (its task 13.3) goes before this check once it lands.
      - name: Check the package page has no moving or wrong-version documentation links
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: python3 tools/check-release-links.py --version "${VERSION#v}" dist/*.whl
      - name: Check the wheel holds no team data and stays under 5 MB
        run: |
          python - <<'EOF'
          import pathlib, zipfile
          (wheel,) = pathlib.Path("dist").glob("*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          bad = [n for n in names if "/robots/" in n or n.endswith((".wpilog", ".hoot"))]
          assert not bad, bad
          assert "flashpoint/defaults/report.toml" in names
          assert "flashpoint/web/static/index.html" in names  # the frontend ships as-is
          assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names)
          assert wheel.stat().st_size < 5 * 1024 * 1024, wheel.stat().st_size
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: release-notes
          path: release-notes/

  pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flashpoint
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Only after PyPI has the version: a held-back or failed publish leaves no GitHub Release.
  github-release:
    if: github.event_name == 'push'
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            marker=(--prerelease --latest=false)
          else
            marker=(--latest)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file release-notes/notes.md "${marker[@]}"

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/flashpoint
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
