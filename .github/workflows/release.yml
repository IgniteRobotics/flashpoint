name: release

# A `v*` tag builds the sdist and wheel with the version taken from the tag and publishes them
# to PyPI by trusted publishing (OIDC, no stored token). A manual run publishes a dry run to
# TestPyPI instead, under the version given.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the TestPyPI dry run (e.g. 0.2.0.dev1)"
        required: true

# Read-only by default; the publish jobs widen it to id-token for trusted publishing.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: pipx install poetry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set the version
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: poetry version "${VERSION#v}"
      - run: poetry build
      - name: Check the wheel holds no team data and stays under 5 MB
        run: |
          python - <<'EOF'
          import pathlib, zipfile
          (wheel,) = pathlib.Path("dist").glob("*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          bad = [n for n in names if "/robots/" in n or n.endswith((".wpilog", ".hoot"))]
          assert not bad, bad
          assert "flashpoint/defaults/report.toml" in names
          assert "flashpoint/web/static/index.html" in names  # the frontend ships as-is
          assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names)
          assert wheel.stat().st_size < 5 * 1024 * 1024, wheel.stat().st_size
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flashpoint
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/flashpoint
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
