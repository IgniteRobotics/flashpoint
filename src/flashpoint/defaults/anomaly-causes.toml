text = "Wheel bearing wear"

[[cause]]
method = "DRIFT"
metric = "stator_current_p95"
subsystem = "drivetrain"
text = "Debris or carpet fiber in the gear mesh"

[[cause]]
method = "DRIFT"
metric = "stator_current_p95"
subsystem = "drivetrain"
text = "A bent bevel gear or misaligned module"

[[cause]]
method = "DRIFT"
metric = "temp_max_c"
text = "Warmer venue temperatures"

[[cause]]
method = "DRIFT"
metric = "temp_max_c"
text = "Early wear"

[[cause]]
method = "DRIFT"
metric = "isolated_gaps"
text = "A CAN connector working loose"

