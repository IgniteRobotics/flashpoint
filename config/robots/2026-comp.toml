# --- NetworkTables signals (roots: config/seasons/2026.toml) ------------------------

# intake
[[signal]]
id = "intake-extension-output"
root = "robot"
entry = "Intake/extensionMotor/Value"
subsystem = "intake"
component = "intake-extension"
metric = "output"

[[signal]]
id = "intake-roller-output"
root = "robot"
entry = "Intake/rollerLeader/Value"
subsystem = "intake"
component = "intake-roller"
metric = "output"

[[signal]]
id = "intake-roller-follower-output"
root = "robot"
entry = "Intake/rollerFollower/Value"
subsystem = "intake"
component = "intake-roller-follower"
metric = "output"

[[signal]]
id = "intake-extension-target"
root = "robot"
entry = "Intake/Extension Target"
subsystem = "intake"
component = "extension"
metric = "target"

[[signal]]
id = "intake-at-extension-setpoint"
root = "robot"
entry = "Intake/At Extension Setpoint"
subsystem = "intake"
component = "extension"
metric = "at_setpoint"

[[signal]]
id = "intake-beyond-roller-setpoint"
root = "robot"
entry = "Intake/Beyond Roller Setpoint"
subsystem = "intake"
component = "roller"
metric = "beyond_setpoint"

[[signal]]
id = "intake-compliant-mode"
root = "robot"
entry = "Intake/Compliant Mode Enabled"
subsystem = "intake"
component = "extension"
metric = "compliant_mode"

[[signal]]
id = "intake-below-compliant-current-limit"
root = "robot"
entry = "Intake/Below Complaint Current Limit"
subsystem = "intake"
component = "extension"
metric = "below_compliant_current_limit"


# indexer
[[signal]]
id = "indexer-main-output"
root = "robot"
entry = "Indexer/indexerMotor/Value"
subsystem = "indexer"
component = "indexer-main"
metric = "output"

[[signal]]
id = "indexer-accelerator-output"
root = "robot"
entry = "Indexer/acceleratorMotor/Value"
subsystem = "indexer"
component = "indexer-accelerator"
metric = "output"


# shooter
[[signal]]
id = "flywheel-left-leader-output"
root = "robot"
entry = "Shooter/flywheelMotorLeftLeader/Value"
subsystem = "shooter"
component = "flywheel-left-leader"
metric = "output"

[[signal]]
id = "flywheel-left-follower-output"
root = "robot"
entry = "Shooter/flywheelMotorLeftFollower/Value"
subsystem = "shooter"
component = "flywheel-left-follower"
metric = "output"

[[signal]]
