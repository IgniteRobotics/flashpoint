entry = "Shooter/flywheelMotorRight/Value"
subsystem = "shooter"
component = "flywheel-right"
metric = "output"

[[signal]]
id = "hood-output"
root = "robot"
entry = "Shooter/hoodMotor/Value"
subsystem = "shooter"
component = "hood"
metric = "output"

[[signal]]
id = "shooter-velocity-target"
root = "robot"
entry = "Shooter/Velocity Target RPS"
subsystem = "shooter"
component = "flywheel"
metric = "velocity_target_rps"

[[signal]]
id = "shooter-hood-target"
root = "robot"
entry = "Shooter/Hood Target (radians)"
subsystem = "shooter"
component = "hood"
metric = "angle_target_rad"

[[signal]]
id = "shooter-hood-angle"
root = "robot"
entry = "Shooter/Hood Angle Rotations"
subsystem = "shooter"
component = "hood"
metric = "angle_rot"

[[signal]]
id = "shooter-at-hood-setpoint"
root = "robot"
entry = "Shooter/At Hood Setpoint"
subsystem = "shooter"
component = "hood"
metric = "at_setpoint"


# hunter
[[signal]]
