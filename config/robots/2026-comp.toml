# 2026 competition robot (Robot-2026).
# Sources: Robot-2026 `development`: generated/TunerConstants.java (swerve IDs and ratios) and the
# subsystem constants (intake, indexer, shooter); motor models from hoot ConnectedMotor (GACMP Q7).
robot = "2026-comp"
season = 2026
project = "Robot-2026"

# --- drivetrain (CANivore "DriveTrain") --------------------------------------------------
[[slot]]
id = "drive-fl"
bus = "canivore"
model = "TalonFX"
can_id = 11
subsystem = "drivetrain"
role = "front-left drive"
