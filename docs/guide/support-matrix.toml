# The support matrix (mvp-documentation design D-e). `python tools/gen-support-matrix.py` renders
# it into support-matrix.md; tests/test_docs_support_matrix.py checks the rules and that the
# page is current.
#
# A cell is one of: "supported", "supported (needs Phoenix Pro)", "rough", "not tested on real
# logs", "not tested", "not supported".
# - supported: `evidence` names a corpus group (tests/corpus/manifest.toml), a path under tests/,
#   or "outside:<yyyy-mm>" with an `issue`. Outside teams are never named.
# - rough: give `workaround` and `issue`.
# - not supported: give an `issue`, on the cell or the row.
# - not tested on real logs: only synthetic fixtures cover it.
# Optional `note` is shown under the value.

