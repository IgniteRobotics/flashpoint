[project]
name = "flashpoint"
version = "0.2.0"
description = "FRC robot telemetry platform: ingest WPILib and CTRE logs, track motor health across a robot's life"
authors = [{ name = "Ignite Robotics" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = ["frc", "first-robotics", "wpilib", "ctre", "phoenix6", "telemetry", "datalog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy (>=2.0,<2.5)", "numba (>=0.61,<0.69)", "polars (>=1.30,<2)", "pyarrow (>=18,<26)", "duckdb (>=1.3,<2)", "pydantic (>=2.7,<3)", "paramiko (>=5.0.0,<6.0.0)", "tomlkit (>=0.13,<0.16)", "pyntcore (>=2026.2.2,<2027)"]

[project.urls]
Homepage = "https://github.com/IgniteRobotics/flashpoint"
Documentation = "https://github.com/IgniteRobotics/flashpoint/blob/main/docs/guide/README.md"
Issues = "https://github.com/IgniteRobotics/flashpoint/issues"

[project.scripts]
flashpoint = "flashpoint.cli:main"

[project.optional-dependencies]
ml = ["scikit-learn (>=1.5,<2)"]

[tool.poetry]
packages = [{ include = "flashpoint", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
ruff = "^0.17"
mypy = "^1.18"
robotpy-wpiutil = "^2026.2.2"
types-paramiko = "^5.0.0.20260724"
pytest-timeout = "^2.4.0"
pytest-playwright = "^0.9.0"
pre-commit = "^4.7.0"
pytest-cov = "^7.1.0"
types-pyyaml = "^6.0.12.20261113"

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--strict-markers -q -m \"not corpus and not perf and not browser\""
testpaths = ["tests"]
# A hang dumps every thread's stack and aborts the whole run (the "thread" method cannot fail
# just the one test); it also works on Windows.
timeout = 300
timeout_method = "thread"
markers = [
    "corpus: tests that need the golden log corpus (run tools/fetch-corpus.py first)",
    "perf: timing/memory budget tests (need the corpus; run on demand or in the perf CI job)",
    "browser: Chromium tests of the web app (playwright install chromium; the browser CI job)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Lint the package, its tests, and the tools.
include = ["src/**/*.py", "tests/**/*.py", "tools/**/*.py"]
# Deliberately bad files for the gate self-tests (tests/test_quality.py).
extend-exclude = ["tests/fixtures/quality"]

[tool.ruff.lint]
# The coding standards live in docs/guide/developer-guide.md (source: ignition-labs). Every
# rule here is blocking. tests/test_quality.py proves each enforced rule still fires.
select = [
    "E", "F", "W", "I", "B", "UP", "N", "SIM", "PTH",
    "S",     # security: subprocess, SQL, URLs, binds
    "BLE",   # no catch-all except outside a recorded boundary
    "T20",   # no print in library code
    "DTZ",   # timezone-aware date-times
    "C90",   # complexity ceiling
    "ARG",   # unused arguments
    "PERF",  # needless loops
    "PT",    # pytest style
    "PGH",   # no blanket noqa
    "RUF",   # includes RUF100: no unused noqa
    "TID",   # banned APIs below
]
# Asserts state invariants for the type checker; Flashpoint never runs under -O.
ignore = ["S101"]
# En dash for ranges in UI text ("qm3–qm7").
allowed-confusables = ["–"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sys.exit".msg = "Library code doesn't exit the process (#57); raise, and let the CLI exit."
"os._exit".msg = "Library code doesn't exit the process (#57)."
"os.system".msg = "Never a shell string (#54); use subprocess with an argument list."
"os.popen".msg = "Never a shell string (#54); use subprocess with an argument list."

[tool.ruff.lint.per-file-ignores]
# The command-line entry point owns process exit and terminal output.
"src/flashpoint/cli.py" = ["T20", "TID251"]
"src/flashpoint/__main__.py" = ["T20", "TID251"]
"tools/**" = ["T20", "TID251"]
# Tests assert, use fake secrets, call local servers and subprocesses on purpose, and request
# fixtures for their side effects; their fake CLIs exit. PT018 would split 526 compound asserts
# in frozen tests.
"tests/**" = [
    "S101", "S104", "S105", "S106", "S310", "S311", "S603", "S607", "S608",
    "T20", "TID251", "ARG", "PT018", "RUF001",
]

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["^tests/fixtures/quality/"]
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
# Third-party packages without type stubs.
module = ["pyarrow", "pyarrow.*", "numba", "numba.*", "wpiutil", "wpiutil.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.coverage.run]
# Measured on the unit run with NUMBA_DISABLE_JIT=1 (the reader kernels are invisible when
# compiled). The CI py3.12 leg sets it; set it yourself to reproduce CI's numbers.
source = ["flashpoint"]
branch = true

[tool.coverage.report]
# Floors go up, never down; lowering one needs a mentor's approval. The 85% floors on readers/,
# lake/, and semantics/physics.py are separate steps in .github/workflows/ci.yml.
fail_under = 93
skip_covered = true
